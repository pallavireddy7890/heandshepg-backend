# Nixpacks configuration for He&She PG Backend
providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "postgresql"]

[phases.install]
cmds = ["python3 -m pip install --upgrade pip", "python3 -m pip install -r requirements.txt"]

[start]
cmd = "python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
